services:
  db:
    image: postgres:16
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Runs Puma + Tailwind watch (polling) so CSS rebuilds as views change.
    command: bash bin/docker-dev
    volumes:
      # Bind-mount must match WORKDIR (/app) so generator output and edits sync both ways.
      - .:/app
      # Keep container gem cache off the Windows bind mount.
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/my_cook_concierge_development
      # Explicitly clear production bundle flags from any leftover image env.
      BUNDLE_DEPLOYMENT: "0"
      BUNDLE_WITHOUT: ""

volumes:
  db_data:
  bundle_cache:
