<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>システムエラー | My Cook Concierge</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #FFF9F0;
        color: #451a03;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 28rem;
        background: #fff;
        border: 1px solid rgba(251, 191, 36, 0.35);
        border-radius: 1.25rem;
        box-shadow: 0 20px 40px rgba(120, 53, 15, 0.08);
        padding: 2.5rem 2rem;
        text-align: center;
      }

      .icon {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 9999px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }

      .code {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #c2410c;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 9999px;
        padding: 0.35rem 0.75rem;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        line-height: 1.35;
        color: #451a03;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 0.95rem;
        line-height: 1.7;
        color: rgba(69, 26, 3, 0.72);
        margin-bottom: 1.75rem;
      }

      .button {
        display: inline-block;
        padding: 0.85rem 1.75rem;
        border-radius: 0.85rem;
        background: #f59e0b;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.28);
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .button:hover {
        background: #d97706;
        transform: translateY(-1px);
      }

      .brand {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        font-weight: 700;
        color: rgba(120, 53, 15, 0.55);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">⚠️</div>
      <p class="code">500 INTERNAL SERVER ERROR</p>
      <h1>システムエラーが発生しました</h1>
      <p>
        申し訳ありません。ただいま一時的な不具合が発生しています。<br>
        しばらく時間をおいてから、もう一度お試しください。
      </p>
      <a href="/" class="button">トップページに戻る</a>
      <p class="brand">My Cook Concierge</p>
    </main>
  </body>
</html>
